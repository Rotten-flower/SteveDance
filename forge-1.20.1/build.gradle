// SteveDance — Forge 1.20.1 public source export
// Minimal standalone build. Source in ../common/src/main/java + ./src/main/java.
// Prepacked resources at ../release-resources (README: see cautions).
// Toolchain: Java 17, Gradle 8.8, ForgeGradle 6.0.54, MixinGradle 0.7-SNAPSHOT.

buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://repo.spongepowered.org/maven' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'org.spongepowered.mixin'

group   = mod_group_id
version = mod_version
base { archivesName = "${mod_id}-forge-1.20.1" }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDirs = [file('../release-resources'), file('src/main/resources')]

repositories { mavenCentral() }

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation('org.tukaani:xz:1.10') { transitive = false }
    jarJar('org.tukaani:xz:1.10') { jarJar.ranged(it, '[1.10,2.0)'); transitive = false }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

// --- JarJar for embedded xz (nested, not shaded) ---
jarJar.enable()
jarJar.disableDefaultSources()
tasks.named('jarJar').configure {
    archiveClassifier.set('')
    dependsOn 'reobfJar'
    // Nest the remapped main JAR, not dev-named sourceSet outputs.
    from({ zipTree(tasks.named('jar').get().archiveFile.get().asFile) })
    manifest { attributes 'MixinConfigs': 'stevedance.mixins.json,stevedance.presentation.mixins.json' }
}

// --- Resource expansion: only mods.toml ---
def resourceProps = [
    mod_id: mod_id, mod_name: mod_name, mod_version: mod_version,
    mod_authors: mod_authors, mod_license: mod_license, mod_description: mod_description
]
processResources {
    inputs.properties resourceProps
    filesMatching('META-INF/mods.toml') { expand resourceProps }
    filteringCharset = 'UTF-8'
}

// --- Slim jar (sources only) + reobf chain ---
tasks.named('jar', Jar) {
    archiveClassifier.set('slim')
    finalizedBy 'reobfJar'
    manifest { attributes 'MixinConfigs': 'stevedance.mixins.json,stevedance.presentation.mixins.json' }
}
tasks.matching { it.name == 'reobfJarJar' }.configureEach { mustRunAfter 'reobfJar' }

// --- Mixin / refmap (generated by compile -> stevedance.refmap.json) ---
mixin {
    add sourceSets.main, 'stevedance.refmap.json'
    config 'stevedance.mixins.json'
    config 'stevedance.presentation.mixins.json'
}

// --- Minecraft / runs ---
minecraft {
    mappings channel: 'official', version: minecraft_version
    runs {
        configureEach {
            workingDirectory project.file('run')
            mods { "${mod_id}" { source sourceSets.main } }
        }
        client {}
        server { workingDirectory project.file('run-server'); args '--nogui' }
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 17 }
tasks.withType(ProcessResources).configureEach { filteringCharset = 'UTF-8' }

// --- Optional F2 addon jar (does not block base build) ---
def f2PacksDir = project.findProperty('f2Packs')
if (f2PacksDir) {
    def packsRoot = file(f2PacksDir)
    if (!packsRoot.isDirectory()) throw new GradleException("f2Packs directory not found: ${packsRoot}")
    def index = new File(packsRoot, 'index.json')
    if (!index.isFile()) throw new GradleException("f2Packs index.json missing in ${packsRoot}")
    def zpkgs = packsRoot.listFiles().findAll { it.isFile() && it.name.toLowerCase().endsWith('.zip') }
    if (zpkgs.size() != 39) throw new GradleException("f2Packs must contain exactly 39 ZIPs, found ${zpkgs.size()}")

    tasks.register('f2AddonJar', Jar) {
        archiveFileName.set("stevedance-f2-forge-1.20.1-${mod_version}.jar")
        destinationDirectory.set(layout.buildDirectory.dir('libs'))
        entryCompression = ZipEntryCompression.STORED // ZIPs already compressed
        from(packsRoot) { into 'assets/stevedance_f2/bundled-packs' }
        from('src/f2Addon/resources') { expand(mod_version: mod_version) }
    }
}

// --- Optional YSM / TLM integration: reflection only, no compile dependency needed ---
// (Nothing to wire here; source already uses reflection.)
